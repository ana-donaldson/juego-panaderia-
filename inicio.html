<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panadería "Reino del pastel"</title>

    <!-- p5.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css?v=3" />
    <!-- Centrado y video de fondo: van acá para que no dependan de la caché de style.css -->
    <style>
        html { width: 100%; height: 100%; background: #f5e6d3; }
        body { margin: 0; width: 100%; min-height: 100vh; overflow: hidden; background: transparent;
               display: flex; justify-content: center; align-items: center; }
        #video-fondo { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                       object-fit: cover; object-position: center; z-index: -1; display: none; }
        canvas { display: block; position: relative; z-index: 1; }
        body.en-menu canvas { box-shadow: none !important; border-radius: 0 !important; }
    </style>
</head>
<body>

   <!-- Video de fondo -->
    <video autoplay muted loop playsinline id="video-fondo" style="opacity: 0.5;">
        <source src="videos/fondo.mp4" type="video/mp4">
        Tu navegador no admite videos.
    </video>

   

    <!-- 1. DATOS (clientes, productos, etc.) -->
    <script src="js/datos.js"></script>

    <!-- 2. DIBUJO DEL CLIENTE -->
    <script src="js/cliente.js"></script>

    <!-- 3. LÓGICA DEL CAJERO -->
    <script src="js/cajero.js"></script>

    <!-- 4. INTERFAZ (menú, pantallas) -->
    <script src="js/ui.js"></script>

     <!-- Modo Cocinero (NUEVOS) -->
    <script src="js/cocinero.js"></script>
    <script src="js/ui-cocinero.js"></script>

    <!-- 5. PRINCIPAL (setup, draw, keyPressed) -->
    <script src="js/sketch.js"></script>

</body>
</html>
